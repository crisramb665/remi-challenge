# The whole stack (SPEC section 7):
#
#   anvil     local node, in memory, so every start is a new chain
#   postgres  database of the API, on tmpfs, so every start is a new database
#   deploy    deploys the contract and writes the address and deploy block to the shared volume, then exits
#   api       indexer and HTTP API, starts once deploy has finished
#
#   docker compose down -v && docker compose up -d --build --wait && bash e2e.sh
#
# Everything here is for local use: Anvil's default accounts and a database password that is public.

name: escrow

services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:v1.5.1
    entrypoint: ["anvil"]
    command: ["--host", "0.0.0.0"]
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD", "cast", "chain-id", "--rpc-url", "http://127.0.0.1:8545"]
      interval: 2s
      timeout: 3s
      retries: 30

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: escrow
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d escrow"]
      interval: 2s
      timeout: 3s
      retries: 30

  deploy:
    build: ./contracts
    depends_on:
      anvil:
        condition: service_healthy
    environment:
      RPC_URL: http://anvil:8545
      DEPLOYMENT_FILE: /shared/deployment.json
    volumes:
      - shared:/shared
    restart: "no"

  api:
    build: ./api
    depends_on:
      anvil:
        condition: service_healthy
      postgres:
        condition: service_healthy
      deploy:
        condition: service_completed_successfully
    environment:
      RPC_URL: http://anvil:8545
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/escrow
      # e2e.sh mines this many blocks after each transaction, keep both values equal.
      CONFIRMATIONS: "2"
      BATCH_SIZE: "500"
      POLL_INTERVAL_MS: "500"
      DEPLOYMENT_FILE: /shared/deployment.json
    volumes:
      - shared:/shared:ro
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  shared:
