# CI (SPEC section 7): contract tests, API tests, `forge fmt --check` and the linter, plus Slither.
# The commands are the ones in CLAUDE.md. The Docker stack, e2e.sh and the deep invariant run
# (`make test-deep`) are not run here, see the README for how to run them.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          # forge-std and OpenZeppelin are git submodules in contracts/lib.
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          # The version the contracts were developed and tested with.
          version: v1.5.1

      - name: Formatting
        run: forge fmt --check

      - name: Build
        run: forge build

      - name: Tests
        run: forge test -vvv

  slither:
    name: Slither
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Slither compiles the project with forge.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The version the findings in docs/slither.md were triaged with.
      - name: Install Slither
        run: pip install slither-analyzer==0.11.6

      # Same scope as `make slither`. The two detectors left out are the ones triaged as accepted or
      # false positives in docs/slither.md; any finding from another detector fails the job.
      - name: Slither
        run: >-
          slither .
          --filter-paths "lib/|test/|script/"
          --exclude incorrect-equality,timestamp
          --fail-pedantic

  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      # The database tests and the HTTP tests run against this Postgres.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: escrow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d escrow"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # Without this variable the database tests are skipped with a warning, so it is set for every step.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/escrow
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: api/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test

      - name: HTTP tests
        run: pnpm test:e2e
